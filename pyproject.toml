[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=78.1.1", "wheel"]

[project]
description = "Governed, Observable & Declarative Machine Learning Framework"
license = "MIT"
license-files = ["LICENSE"]
name = "godml"
readme = "README.md"
requires-python = ">=3.11,<3.14"
version = "1.3.0"

authors = [{name = "Arturo Gutierrez Rubio Rojas", email = "agtzrubio@dagmalia.com"}]

maintainers = [
  {name = "Arturo Gutierrez Rubio Rojas", email = "agtzrubio@dagmalia.com"},
]

keywords = [
  "mlops",
  "machine learning",
  "framework",
  "governance",
  "observability",
  "mlflow",
  "sagemaker",
  "dagmalia",
  "supply-chain-security",
  "slsa",
  "cosign",
  "sigstore",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Natural Language :: English",
  "Natural Language :: Spanish",
]

# ─────────────────────────────────────────────────────────
# CORE dependencies (always installed — lightweight)
# pip install godml
# ─────────────────────────────────────────────────────────
dependencies = [
  # CLI & UX
  "typer>=0.12.0,<1",
  "click>=8.1.0,<9",
  "rich>=13.0.0,<16",
  # Config & validation
  "pydantic>=2.11.0,<3",
  "pyyaml>=6.0.0,<7",
  # Data & ML core
  "pandas>=2.0.0,<4",
  "numpy>=1.24.0,<3.0",
  "scikit-learn>=1.5.0,<2",
  "xgboost>=2.0.0,<4",
  # Experiment tracking (lightweight install)
  "mlflow>=2.13.0,<4",
  # Artifacts & serialization
  "joblib>=1.3.0,<2",
  # Network
  "urllib3>=2.0.0,<3",
  # Security
  "protobuf>=4.25.0,<8",
]

[project.scripts]
godml = "godml.godml_cli:main"

[project.urls]
"Documentation" = "https://godmlcore.com"
"Homepage" = "https://godmlcore.com"
"Source" = "https://github.com/DAGMALIA/godml"
"PyPI" = "https://pypi.org/project/godml/"
"SLSA Framework" = "https://slsa.dev/"
"Supply Chain Verified" = "https://search.sigstore.dev/?q=DAGMALIA"

# ─────────────────────────────────────────────────────────
# OPTIONAL extras — install what you need
# ─────────────────────────────────────────────────────────
[project.optional-dependencies]

# pip install godml[api]
# Deploy service (FastAPI microservice)
api = [
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.29.0,<1",
]

# pip install godml[aws]
# AWS / SageMaker support
aws = [
  "boto3>=1.34.0,<2",
  "sagemaker>=2.200.0,<4",
]

# pip install godml[deep]
# Deep learning (TensorFlow + Keras)
deep = [
  "tensorflow>=2.16.0,<3",
  "keras>=3.0.0,<4",
]

# pip install godml[advisor]
# AI advisor / RAG features (heavy: gpt4all is ~2GB)
advisor = [
  "gpt4all>=2.0.0,<3",
  "lightgbm>=4.0.0,<5",
]

# pip install godml[data]
# Extended data connectors
data = [
  "pyarrow>=15.0.0,<26",
  "pymysql>=1.1.0,<2",
]

# pip install godml[observability]
# Runtime observability: expone /metrics para Prometheus y calcula drift (PSI).
# Sin esta extra el servicio funciona igual, con las métricas degradadas a no-ops.
observability = [
  "prometheus-client>=0.20.0,<1",
]

# pip install godml[dev]
# Development tools only: test runner, lint, types, hooks. No runtime extras,
# so nothing (fastapi, boto3, ...) is pulled in implicitly (F0-13).
dev = [
  "pytest>=8.0.0,<10",
  "pytest-cov>=5.0.0,<8",
  "pytest-mock>=3.14.0,<4",
  "ruff>=0.15.17,<0.16",
  "mypy>=1.19,<2",
  "types-PyYAML>=6.0,<7",
  "pre-commit>=4.0,<5",
]

# Test dependencies per pillar. CI installs dev + every test-* extra, so no
# test is skipped for a missing dependency.
# pip install "godml[dev,test-serve,test-observe]"
test-serve = [
  "godml[api]",
  # fastapi.testclient.TestClient requires httpx
  "httpx>=0.27.0,<1",
]
test-observe = [
  # Without prometheus_client the observability tests run against the no-op
  # metrics fallback and verify nothing.
  "godml[observability]",
]

# pip install godml[all]
# Everything (except dev tools)
all = [
  "godml[api]",
  "godml[aws]",
  "godml[deep]",
  "godml[advisor]",
  "godml[data]",
  "godml[observability]",
]

[tool.setuptools.package-data]
"godml.utils" = ["README_TEMPLATE.txt", "DOCKERFILE_TEMPLATE.txt"]

[tool.setuptools.packages.find]
exclude = ["tests*", "venv*", "*.egg-info*"]
include = ["godml*"]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle + pyflakes (as the previous CI lint) plus the fail-closed rules:
# no silent `except Exception: pass` and no blind excepts. Pre-existing
# violations are tagged `# noqa: S110` / `# noqa: BLE001` as tracked debt
# (F1 removes them); new ones fail CI.
extend-select = ["E", "W", "S110", "BLE001"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
# Example notebooks re-import across cells and demo optional steps.
"*.ipynb" = ["F811", "BLE001"]

[tool.mypy]
# Gradual mode (F0-04): default strictness, every module is checked.
python_version = "3.11"
files = ["godml"]
ignore_missing_imports = true

# Debt: modules with type errors at F0-04 (46 errors). Remove an entry once
# the module is clean; never add new ones.
[[tool.mypy.overrides]]
module = [
  "godml.advisor_service.advisor_orchestrator",
  "godml.compliance_service.validation_helpers",
  "godml.dataprep_service.recipe_executor",
  "godml.dataprep_service.transforms.quality",
  "godml.dataprep_service.transforms.text",
  "godml.dataprep_service.transforms.window",
  "godml.model_service.model_registry.lstm_forecast_model",
  "godml.model_service.model_registry.model_registry",
  "godml.monitoring_service.observability",
  "godml.notebook_api.advisor",
  "godml.notebook_api.pipeline",
  "godml.providers.mlflow",
  "godml.providers.sagemaker.scripts.preprocess",
  "godml.utils.model_storage",
  "godml.utils.predict_safely",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Third-party warnings stay visible in the summary. Deprecations raised from
# godml's own modules fail the test (F0-11).
filterwarnings = [
  'error::DeprecationWarning:godml(\..*)?',
  'error::PendingDeprecationWarning:godml(\..*)?',
  # Known: FastAPI on_event in the 1.x server; replaced by lifespan in F5-03.
  'ignore:\s*on_event is deprecated:DeprecationWarning:godml\.deploy_service\.server',
]

[tool.coverage.run]
source = ["godml"]
# Real coverage: only tests and generated code are excluded. Do not add
# modules here to hide them; raise fail_under per phase instead (F0-10).
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  # Scaffold copied verbatim into user projects by `godml init`/`godml deploy`
  "godml/templates/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
fail_under = 48  # real coverage at F0-10 (48.4 %); raise per phase