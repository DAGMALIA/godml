[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=78.1.1", "wheel"]

[project]
description = "Governed, Observable & Declarative Machine Learning Framework"
license = "MIT"
license-files = ["LICENSE"]
name = "godml"
readme = "README.md"
requires-python = ">=3.11,<3.14"
version = "2.0.0.dev0"

authors = [{name = "Arturo Gutierrez Rubio Rojas", email = "agtzrubio@dagmalia.com"}]

maintainers = [
  {name = "Arturo Gutierrez Rubio Rojas", email = "agtzrubio@dagmalia.com"},
]

keywords = [
  "mlops",
  "machine learning",
  "framework",
  "governance",
  "observability",
  "mlflow",
  "sagemaker",
  "dagmalia",
  "supply-chain-security",
  "slsa",
  "cosign",
  "sigstore",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Natural Language :: English",
  "Natural Language :: Spanish",
]

# ─────────────────────────────────────────────────────────
# CORE dependencies (always installed — lightweight)
# pip install godml
# ─────────────────────────────────────────────────────────
dependencies = [
  # CLI & UX
  "typer>=0.12.0,<1",
  "click>=8.1.0,<9",
  "rich>=13.0.0,<16",
  # Config & validation
  "pydantic>=2.11.0,<3",
  "pyyaml>=6.0.0,<7",
  # Data & ML core
  "pandas>=2.0.0,<4",
  "numpy>=1.24.0,<3.0",
  "scikit-learn>=1.5.0,<2",
  "xgboost>=2.0.0,<4",
  # Experiment tracking (lightweight install)
  "mlflow>=2.13.0,<4",
  # Artifacts & serialization
  "joblib>=1.3.0,<2",
  # Network
  "urllib3>=2.0.0,<3",
  # Security
  "protobuf>=4.25.0,<8",
]

[project.scripts]
godml = "godml.godml_cli:main"

[project.urls]
"Documentation" = "https://godmlcore.com"
"Homepage" = "https://godmlcore.com"
"Source" = "https://github.com/DAGMALIA/godml"
"PyPI" = "https://pypi.org/project/godml/"
"SLSA Framework" = "https://slsa.dev/"
"Supply Chain Verified" = "https://search.sigstore.dev/?q=DAGMALIA"

# ─────────────────────────────────────────────────────────
# OPTIONAL extras — install what you need
# ─────────────────────────────────────────────────────────
[project.optional-dependencies]

# pip install godml[api]
# Deploy service (FastAPI microservice)
api = [
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.29.0,<1",
]

# pip install godml[aws]
# AWS / SageMaker support
aws = [
  "boto3>=1.34.0,<2",
  # SDK v3 removed sagemaker.workflow / processing / image_uris used by the
  # executor (F1-23); porting to v3 is F4-07.
  "sagemaker>=2.257.2,<3",  # 2.257.2 fixes PYSEC-2026-3060
]

# pip install godml[deep]
# Deep learning (TensorFlow + Keras)
deep = [
  "tensorflow>=2.16.0,<3",
  "keras>=3.0.0,<4",
]

# pip install godml[advisor]
# AI advisor / RAG features (heavy: gpt4all is ~2GB)
advisor = [
  "gpt4all>=2.0.0,<3",
  "lightgbm>=4.0.0,<5",
]

# pip install godml[data]
# Extended data connectors
data = [
  "pyarrow>=15.0.0,<26",
  "pymysql>=1.1.0,<2",
]

# pip install godml[observability]
# Runtime observability: expone /metrics para Prometheus y calcula drift (PSI).
# Sin esta extra el servicio funciona igual, con las métricas degradadas a no-ops.
observability = [
  "prometheus-client>=0.20.0,<1",
]

# pip install godml[dev]
# Development tools only: test runner, lint, types, hooks. No runtime extras,
# so nothing (fastapi, boto3, ...) is pulled in implicitly (F0-13).
dev = [
  "pytest>=8.0.0,<10",
  "pytest-cov>=5.0.0,<8",
  "pytest-mock>=3.14.0,<4",
  "ruff>=0.15.17,<0.16",
  "mypy>=1.19,<2",
  "types-PyYAML>=6.0,<7",
  "import-linter>=2.15,<3",
  # pre-commit is installed separately (`pipx install pre-commit`): its
  # patched virtualenv needs packaging>=26.3 while the patched SageMaker SDK
  # needs packaging<25, so one environment cannot hold both without CVEs.
]

# Test dependencies per pillar. CI installs dev + every test-* extra, so no
# test is skipped for a missing dependency.
# pip install "godml[dev,test-serve,test-observe,test-aws]"
test-serve = [
  "godml[api]",
  # fastapi.testclient.TestClient requires httpx
  "httpx>=0.27.0,<1",
]
test-aws = [
  # Real SageMaker SDK for the SDK contract tests (F1-22): a fake-only test
  # could not notice that SDK v3 removed every module the executor imports.
  "godml[aws]",
]
test-observe = [
  # Without prometheus_client the observability tests run against the no-op
  # metrics fallback and verify nothing.
  "godml[observability]",
]

# pip install godml[all]
# Everything (except dev tools)
all = [
  "godml[api]",
  "godml[aws]",
  "godml[deep]",
  "godml[advisor]",
  "godml[data]",
  "godml[observability]",
]

[tool.setuptools.package-data]
"godml.tools" = ["README_TEMPLATE.txt", "DOCKERFILE_TEMPLATE.txt"]

[tool.setuptools.packages.find]
exclude = ["tests*", "venv*", "*.egg-info*"]
include = ["godml*"]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle + pyflakes (as the previous CI lint) plus the fail-closed rules:
# no silent `except Exception: pass` and no blind excepts. Pre-existing
# violations are tagged `# noqa: S110` / `# noqa: BLE001` as tracked debt
# (F1 removes them); new ones fail CI.
extend-select = ["E", "W", "S110", "BLE001"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
# Example notebooks re-import across cells and demo optional steps.
"*.ipynb" = ["F811", "BLE001"]

[tool.mypy]
# Gradual mode (F0-04): default strictness, every module is checked.
python_version = "3.11"
files = ["godml"]
ignore_missing_imports = true

# Debt: modules with type errors at F0-04 (46 errors). Remove an entry once
# the module is clean; never add new ones.
[[tool.mypy.overrides]]
module = [
  "godml.tools.advisor.advisor_orchestrator",
  "godml.govern.compliance.validation_helpers",
  "godml.train.dataprep.recipe_executor",
  "godml.train.dataprep.transforms.quality",
  "godml.train.dataprep.transforms.text",
  "godml.train.dataprep.transforms.window",
  "godml.train.models.model_registry.lstm_forecast_model",
  "godml.train.models.model_registry.model_registry",
  "godml.observe.observability",
  "godml.tools.notebook_api.advisor",
  "godml.tools.notebook_api.pipeline",
  "godml.train.providers.mlflow",
  "godml.train.providers.sagemaker.scripts.preprocess",
  "godml.train.model_storage",
  "godml.train.predict_safely",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Third-party warnings stay visible in the summary. Deprecations raised from
# godml's own modules fail the test (F0-11).
filterwarnings = [
  'error::DeprecationWarning:godml(\..*)?',
  'error::PendingDeprecationWarning:godml(\..*)?',
  # Known: FastAPI on_event in the 1.x server and its scaffold template;
  # replaced by lifespan in F5-03.
  'ignore:\s*on_event is deprecated:DeprecationWarning:godml\.(serve\.deploy|templates\.deploy_template)\.server',
]

[tool.coverage.run]
source = ["godml"]
# Real coverage: only tests and generated code are excluded. Do not add
# modules here to hide them; raise fail_under per phase instead (F0-10).
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  # Scaffold copied verbatim into user projects by `godml init`/`godml deploy`
  "godml/templates/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
fail_under = 48  # real coverage at F0-10 (48.4 %); raise per phase
# F2-13: dependency rules between pillars (CLAUDE.md). tools and cli are
# integrators and may import any pillar (lazily; not checked here).
# Each ignore_imports entry is a known violation tagged with the plan task
# that removes it; tests/unit/test_import_contracts.py keeps the list from
# growing.
[tool.importlinter]
root_package = "godml"

[[tool.importlinter.contracts]]
name = "core imports no pillar"
type = "forbidden"
source_modules = ["godml.core"]
forbidden_modules = ["godml.govern", "godml.train", "godml.serve", "godml.observe", "godml.tools", "godml.cli"]
ignore_imports = [
  "godml.core.logger -> godml.govern.thresholds",  # F2-07
]

[[tool.importlinter.contracts]]
name = "govern imports only core"
type = "forbidden"
source_modules = ["godml.govern"]
forbidden_modules = ["godml.train", "godml.serve", "godml.observe", "godml.tools", "godml.cli"]
ignore_imports = [
  "godml.govern.preprocessor -> godml.observe.lineage.openlineage_emitter",  # F2-14
]

[[tool.importlinter.contracts]]
name = "train imports only core and govern"
type = "forbidden"
source_modules = ["godml.train"]
forbidden_modules = ["godml.serve", "godml.observe", "godml.tools", "godml.cli"]
ignore_imports = [
  "godml.govern.preprocessor -> godml.observe.lineage.openlineage_emitter",  # F2-14
  "godml.train.dataprep.recipe_executor -> godml.observe.lineage.openlineage_emitter",  # F2-14
  "godml.train.providers.mlflow -> godml.observe.observability",  # F2-14
  "godml.train.providers.mlflow -> godml.serve.model_loader",  # F2-15
  "godml.train.providers.mlflow -> godml.tools.notebook_api",  # F2-16
]

[[tool.importlinter.contracts]]
name = "serve imports only core and govern"
type = "forbidden"
source_modules = ["godml.serve"]
forbidden_modules = ["godml.train", "godml.observe", "godml.tools", "godml.cli"]
ignore_imports = [
  "godml.serve.deploy.server -> godml.observe.observability",  # F2-14
  "godml.serve.model_loader -> godml.train.models.base_model_interface",  # F2-15
]

[[tool.importlinter.contracts]]
name = "observe imports only core and govern"
type = "forbidden"
source_modules = ["godml.observe"]
forbidden_modules = ["godml.train", "godml.serve", "godml.tools", "godml.cli"]
