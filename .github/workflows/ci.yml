name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,test-serve,test-observe]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=godml \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── Dependency audit (open source, no API key) ───────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # setuptools is upgraded too: the runner's bundled copy has known CVEs
      # and would fail the audit even though godml does not depend on it.
      - name: Install project + pip-audit
        run: |
          pip install --upgrade pip setuptools
          pip install -e "." pip-audit

      - name: Run pip-audit
        run: |
          touch pip-audit-report.md
          pip-audit \
            --desc \
            --format markdown \
            --output pip-audit-report.md \
            || AUDIT_EXIT=$?
          if [ -s pip-audit-report.md ]; then
            cat pip-audit-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No known vulnerabilities found by pip-audit." >> $GITHUB_STEP_SUMMARY
          fi
          exit "${AUDIT_EXIT:-0}"

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.md
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # Same install as the test job so mypy sees the same third-party types.
      - name: Install project + dev tools
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,test-serve,test-observe]"

      # Rules and debt list live in pyproject.toml ([tool.ruff], [tool.mypy]).
      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

  # ── Third-party license report (replaces the hand-written LICENSE_REPORT.md) ─
  licenses:
    name: License report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # Every runtime extra except `deep` (tensorflow is too heavy for this job).
      - name: Install project with runtime extras + pip-licenses
        run: |
          pip install --upgrade pip
          pip install -e ".[api,aws,advisor,data,observability]" "pip-licenses==5.5.5"

      - name: Generate LICENSE_REPORT.md
        run: |
          {
            echo "# GODML third-party license report"
            echo
            echo "Generated by CI (\`pip-licenses\`) from \`pip install -e \".[api,aws,advisor,data,observability]\"\` on Python 3.11 (\`deep\`/tensorflow not included)."
            echo "Commit: $GITHUB_SHA"
            echo
            echo "## Summary"
            echo
            # plain + fence: the markdown summary format swaps its column headers
            echo '```text'
            pip-licenses --from=mixed --summary --format=plain
            echo '```'
            echo
            echo "## Packages"
            echo
            pip-licenses --from=mixed --with-urls --order=license --format=markdown
          } > LICENSE_REPORT.md
          cat LICENSE_REPORT.md >> $GITHUB_STEP_SUMMARY

      # Strong copyleft blocks. Exact names (classifiers + SPDX ids): partial
      # matching would also hit LGPL ("GPL-3.0" is a substring of "LGPL-3.0").
      # Compound expressions (e.g. "MIT OR GPL-3.0-only") are not matched.
      - name: Fail on strong copyleft
        run: |
          deny=(
            "GNU General Public License (GPL)"
            "GNU General Public License v2 (GPLv2)"
            "GNU General Public License v2 or later (GPLv2+)"
            "GNU General Public License v3 (GPLv3)"
            "GNU General Public License v3 or later (GPLv3+)"
            "GNU Affero General Public License v3"
            "GNU Affero General Public License v3 or later (AGPLv3+)"
            GPL-2.0 GPL-2.0-only GPL-2.0-or-later
            GPL-3.0 GPL-3.0-only GPL-3.0-or-later
            AGPL-3.0 AGPL-3.0-only AGPL-3.0-or-later
          )
          pip-licenses --from=mixed --fail-on="$(IFS=';'; echo "${deny[*]}")" > /dev/null

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: license-report
          path: LICENSE_REPORT.md
          retention-days: 90

  install-smoke-test:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core only (no extras)
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Smoke test — core import
        run: python -c "import godml; print('GODML core import OK')"

      - name: Smoke test — no gpt4all needed
        run: |
          python -c "
          from godml.config_service.loader import load_config
          from godml.compliance_service.pci_dss import PciDssCompliance
          from godml.monitoring_service.metrics import compute_metrics
          print('Core services import OK without optional deps')
          "
  # ── SAST — Bandit static analysis (all commits/PRs → feeds Scorecard SAST check) ─
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install "bandit[sarif]==1.9.4"

      - name: Run Bandit (HIGH/CRITICAL only)
        run: |
          bandit -r godml -f sarif -o bandit_report.sarif -lll

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: bandit_report.sarif
          category: bandit