name: 🚀 GODML Stable Release & Supply Chain

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplychain:
    name: 🔐 GODML Supply Chain + PyPI Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      security-events: write
      actions: read

    steps:
      # 1️⃣ Checkout
      - name: 🧾 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}

      # 2️⃣ Python setup
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3️⃣ Extraer versión desde pyproject.toml
      - name: 🏷️ Extract version
        id: version
        run: |
          pip install "toml-cli==0.8.2" --quiet
          VERSION=$(toml get --toml-path pyproject.toml project.version)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      # F1-24: a final X.Y.Z is only tagged once the latest X.Y.ZrcN, installed
      # from PyPI, passed post_publish_smoke.yml. Pre-releases skip this check.
      - name: 🧪 Require green post-publish smoke of the latest RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Pre-release $VERSION: no RC smoke required."
            exit 0
          fi
          RC=$(git ls-remote --tags origin "refs/tags/v${VERSION}rc*" \
            | sed -E 's|.*refs/tags/v||; s|\^\{\}$||' | sort -uV | tail -1)
          if [ -z "$RC" ]; then
            echo "::error::$VERSION has no published RC; publish and smoke-test ${VERSION}rc1 first"
            exit 1
          fi
          gh run list --repo "$GITHUB_REPOSITORY" --workflow post_publish_smoke.yml \
            --status success --limit 200 --json displayTitle --jq '.[].displayTitle' \
            > smoke_runs.txt
          if ! grep -qxF -e "Post-publish smoke $RC" -e "Post-publish smoke v$RC" smoke_runs.txt; then
            echo "::error::No green post-publish smoke for $RC; run post_publish_smoke.yml with version=$RC"
            exit 1
          fi
          echo "✅ $RC passed the post-publish smoke test"

      # 4️⃣ Install dependencies
      - name: 📦 Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev,test-serve,test-observe,test-aws]" bandit[sarif] pip-audit

      # 5️⃣ Tests antes de publicar
      - name: 🧪 Run tests
        run: |
          pip install "pytest>=8.0.0,<10" "pytest-cov>=5.0.0,<8" --quiet
          pytest tests/ -v --tb=short

      # 6️⃣ Static code security scan (Bandit) — bloquea en HIGH/CRITICAL
      - name: 🔍 Bandit Scan (Static Analysis)
        run: |
          echo "🔍 Running Bandit for static code security..."
          bandit -r godml -f sarif -o bandit_report.sarif -lll || BANDIT_EXIT=$?
          bandit -r godml -f txt -o bandit_report.txt -lll --exit-zero  # report only; exit comes from the SARIF run
          cat bandit_report.txt
          if [ "${BANDIT_EXIT:-0}" -ne 0 ]; then
            echo "::error::Bandit encontró vulnerabilidades HIGH o CRITICAL. Revisa bandit_report.sarif."
            exit 1
          fi
          echo "✅ Bandit: sin vulnerabilidades HIGH/CRITICAL."

      # 7️⃣ Upload Bandit SARIF al Security tab de GitHub
      - name: 📊 Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: bandit_report.sarif
          category: bandit

      # Safety (F0-16): blocking. Scans the environment this job actually
      # installed (pinned `pip freeze`), not pyproject's ranges. `safety scan`
      # applies the Safety Platform policy, so the gate script decides: every
      # finding must be a reviewed ignore in .safety-policy.yml (SECURITY.md).
      - name: 📌 Freeze resolved environment for Safety
        run: |
          mkdir -p safety-scan
          pip freeze --exclude-editable > safety-scan/requirements.txt
          wc -l safety-scan/requirements.txt

      - name: 🛡️ Safety Dependency Scan
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          python -m venv "$RUNNER_TEMP/safety-venv"
          "$RUNNER_TEMP/safety-venv/bin/pip" install --quiet safety==3.3.1 typer==0.16.0 click==8.2.1
          "$RUNNER_TEMP/safety-venv/bin/safety" --stage cicd scan             --target safety-scan --policy-file .safety-policy.yml --detailed-output             --save-as json safety-report.json || SAFETY_EXIT=$?
          python .github/scripts/safety_gate.py             --report safety-report.json --policy .safety-policy.yml             --requirements safety-scan/requirements.txt             --safety-exit-code "${SAFETY_EXIT:-0}"

      # 9️⃣ pip-audit (blocking, alongside Safety)
      - name: 🔎 pip-audit dependency scan
        run: |
          echo "🔎 Running pip-audit..."
          touch pip-audit-report.md
          pip-audit \
            --desc \
            --format markdown \
            --output pip-audit-report.md \
            || AUDIT_EXIT=$?
          if [ -s pip-audit-report.md ]; then
            cat pip-audit-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No known vulnerabilities found by pip-audit." >> $GITHUB_STEP_SUMMARY
          fi
          echo "✅ pip-audit complete."
          exit "${AUDIT_EXIT:-0}"

      # 🔟 Generate SBOM (SPDX)
      - name: 🧱 Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # 1️⃣1️⃣ Install Cosign
      - name: 🔑 Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"

      # 1️⃣2️⃣ Sign SBOM (OIDC keyless → Rekor transparency log)
      - name: 🪶 Sign SBOM (OIDC Keyless)
        run: |
          echo "🔐 Signing SBOM..."
          cosign sign-blob --yes \
            --output-signature sbom.spdx.sig \
            --bundle sbom.spdx.bundle \
            --output-certificate sbom.spdx.crt \
            sbom.spdx.json
          echo "✅ SBOM signed and logged to Rekor."

      # 1️⃣3️⃣ Upload supply chain artifacts
      - name: 📤 Upload supply chain artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supplychain-artifacts
          path: |
            bandit_report.txt
            bandit_report.sarif
            pip-audit-report.md
            sbom.spdx.json
            sbom.spdx.sig
            sbom.spdx.crt
            sbom.spdx.bundle

      # 1️⃣4️⃣ Verify SBOM signature
      - name: 🧠 Verify SBOM signature
        run: |
          echo "🧩 Verifying SBOM signature..."
          cosign verify-blob \
            --bundle sbom.spdx.bundle \
            --certificate-identity-regexp "https://github.com/DAGMALIA/godml/.github/workflows/safety_scan.yml" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            sbom.spdx.json
          echo "✅ Signatures verified and auditable."

      # 1️⃣5️⃣ Tag version — triggers release.yml (SLSA L3 + PyPI)
      - name: 🔖 Tag and push version
        run: |
          git config user.name "Arturo Gutierrez Rubio Rojas"
          git config user.email "agtzrubio@dagmalia.com"
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote — skipping. PyPI publish already done."
          else
            git tag -a "$TAG" -m "GODML $TAG — supply chain verified"
            git push origin "$TAG"
            echo "✅ Tag $TAG pushed → triggers release.yml for SLSA L3 + PyPI publish."
          fi

      # 1️⃣6️⃣ Supply chain summary
      - name: 🧾 GODML Supply Chain Summary
        run: |
          echo "## GODML v${{ steps.version.outputs.version }} Supply Chain Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Control | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST | ✅ No HIGH/CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Safety (blocking, .safety-policy.yml) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM (SPDX) | ✅ Signed with Cosign OIDC → Rekor |" >> $GITHUB_STEP_SUMMARY
          echo "| SLSA L3 + PyPI release | ✅ via release.yml on tag push |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $GITHUB_SHA |" >> $GITHUB_STEP_SUMMARY
