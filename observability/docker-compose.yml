# Stack de observabilidad de GODML: Prometheus + Grafana.
#
#   docker compose -f observability/docker-compose.yml up -d
#
# Prometheus scrapea el /metrics del servicio de inferencia levantado con
# `godml serve`. En Linux `host.docker.internal` no existe de forma nativa, por
# eso se declara explícitamente en extra_hosts.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: godml-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: godml-grafana
    restart: unless-stopped
    ports:
      # 3000 es el puerto por defecto de Grafana, pero también el de godml-frontend.
      # Si ya tenés el frontend levantado: GRAFANA_PORT=3001 docker compose up -d
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Credenciales de desarrollo local. En cualquier entorno compartido,
      # reemplazar por secretos reales antes de exponer el puerto.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
